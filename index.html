<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidUpPlay - Stremio Addon Configurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0f12; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background: #161920; border: 1px solid #232734; border-radius: 14px; }
        .input-box { background: #0d0f12; border: 1px solid #2d3345; color: #fff; }
        .input-box:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full card p-6 shadow-2xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    VidUp<span class="text-blue-500">Play</span>
                </h1>
                <p class="text-xs text-gray-400 mt-0.5">Stream formatters, templates & settings</p>
            </div>
            <span class="px-2.5 py-1 text-xs font-semibold bg-blue-950 text-blue-400 border border-blue-800 rounded-full">v2.1.0</span>
        </div>

        <!-- Formatting Presets (Like Pengu) -->
        <div>
            <label class="text-xs uppercase font-bold text-gray-400 tracking-wider">Format Presets</label>
            <div class="grid grid-cols-3 gap-2 mt-2">
                <button onclick="applyPreset('default')" class="py-1.5 px-3 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-white">Default</button>
                <button onclick="applyPreset('prism')" class="py-1.5 px-3 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-white">Prism</button>
                <button onclick="applyPreset('minimal')" class="py-1.5 px-3 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-white">Minimal</button>
            </div>
        </div>

        <!-- Custom Formatter Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Name Template</label>
                <input type="text" id="nameTemplate" value="VidUpPlay" class="w-full input-box rounded-lg px-3 py-2 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Description Template</label>
                <input type="text" id="descTemplate" value="{stream.resolution} • HLS • PeakStorm" class="w-full input-box rounded-lg px-3 py-2 text-sm">
            </div>

            <div class="flex items-center justify-between pt-1">
                <div>
                    <h4 class="text-sm font-medium text-gray-200">Emoji Badges</h4>
                    <p class="text-xs text-gray-400">Include ❄️ 4K and 🧊 1080p badges</p>
                </div>
                <input type="checkbox" id="emojiToggle" checked class="w-4 h-4 accent-blue-600 rounded">
            </div>
        </div>

        <!-- Dynamic Stremio Stream Preview -->
        <div>
            <label class="text-xs uppercase font-bold text-gray-400 tracking-wider">Live Stremio Preview</label>
            <div class="mt-2 bg-[#0d0f12] border border-gray-800 rounded-lg p-3 flex items-start gap-3">
                <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-0.5">▶</div>
                <div class="space-y-0.5">
                    <div id="previewName" class="text-sm font-semibold text-white">🧊 1080p | VidUpPlay</div>
                    <div id="previewDesc" class="text-xs text-gray-400">1080p • HLS • PeakStorm</div>
                </div>
            </div>
        </div>

        <!-- Installation Actions -->
        <div class="space-y-2.5 pt-2">
            <button onclick="installAddon()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                Install to Stremio
            </button>
            <button onclick="copyUrl()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold py-2.5 rounded-lg text-sm border border-gray-700 transition">
                Copy Addon Link
            </button>
        </div>
    </div>

    <script>
        // Set this to your live Render backend URL (no https://)
        const BACKEND_DOMAIN = "vidup-backend.onrender.com";

        const nameInput = document.getElementById('nameTemplate');
        const descInput = document.getElementById('descTemplate');
        const emojiToggle = document.getElementById('emojiToggle');
        const previewName = document.getElementById('previewName');
        const previewDesc = document.getElementById('previewDesc');

        function updatePreview() {
            const name = nameInput.value || "VidUpPlay";
            const desc = descInput.value || "{stream.resolution} • HLS";
            const emojis = emojiToggle.checked;

            previewName.innerText = emojis ? `🧊 1080p | ${name}` : `1080p | ${name}`;
            previewDesc.innerText = desc.replace('{stream.resolution}', '1080p').replace('{addon.name}', name);
        }

        nameInput.addEventListener('input', updatePreview);
        descInput.addEventListener('input', updatePreview);
        emojiToggle.addEventListener('change', updatePreview);

        function applyPreset(type) {
            if (type === 'default') {
                nameInput.value = "VidUpPlay";
                descInput.value = "{stream.resolution} • HLS • PeakStorm";
                emojiToggle.checked = true;
            } else if (type === 'prism') {
                nameInput.value = "Prism • VidUp";
                descInput.value = "🎬 {stream.resolution} | Direct Stream";
                emojiToggle.checked = false;
            } else if (type === 'minimal') {
                nameInput.value = "VidUp";
                descInput.value = "{stream.resolution}";
                emojiToggle.checked = false;
            }
            updatePreview();
        }

        function buildConfiguredUrl() {
            const configObj = {
                nameTemplate: nameInput.value || "VidUpPlay",
                descTemplate: descInput.value || "{stream.resolution} • HLS",
                emojis: emojiToggle.checked
            };
            
            // Professional UTF-8 safe Base64 encoding (prevents Emojis from breaking the buttons)
            const bytes = new TextEncoder().encode(JSON.stringify(configObj));
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
            const b64 = btoa(binString);
            
            return `https://${BACKEND_DOMAIN}/${b64}/manifest.json`;
        }

        function installAddon() {
            const link = buildConfiguredUrl().replace('https://', 'stremio://');
            window.location.href = link;
        }

        function copyUrl() {
            navigator.clipboard.writeText(buildConfiguredUrl()).then(() => {
                alert("Addon Manifest URL copied! Paste into Stremio's addon search bar.");
            }).catch(err => {
                // Fallback for mobile browsers blocking clipboard access
                prompt("Copy this URL and paste into Stremio:", buildConfiguredUrl());
            });
        }
    </script>
</body>
</html>
