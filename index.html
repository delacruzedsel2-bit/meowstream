<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidUp Addon for Stremio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1115; color: #ffffff; }
        .glass-card { background: rgba(25, 27, 33, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass-card p-8 shadow-2xl">
        <div class="flex items-center justify-center mb-6">
            <h1 class="text-3xl font-bold tracking-tight">VidUp<span class="text-blue-500">Play</span></h1>
        </div>
        
        <p class="text-gray-400 text-center mb-8">Install the VidUp scraper directly into Stremio to watch your favorite movies and series.</p>

        <div class="space-y-4">
            <!-- Replace this URL with your actual Cloudflare Worker URL -->
            <button onclick="installAddon()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z"></path></svg>
                Install to Stremio
            </button>

            <button onclick="copyUrl()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 border border-gray-600">
                Copy Addon URL
            </button>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR CLOUDFLARE WORKER URL
        const WORKER_URL = "https://vidup-backend.onrender.com"
        
        const manifestUrl = `https://${WORKER_URL}/manifest.json`;
        const stremioUrl = `stremio://${WORKER_URL}/manifest.json`;

        function installAddon() {
            window.location.href = stremioUrl;
        }

        function copyUrl() {
            navigator.clipboard.writeText(manifestUrl).then(() => {
                alert("Addon URL copied to clipboard! Paste it in the Stremio Addon search bar.");
            });
        }
    </script>
</body>
</html>
